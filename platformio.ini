; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5dial, cyddial
extra_configs = platformio.local.ini

[common]
build_flags =
    !python ./git-version.py
    -DJSP_USE_CHARP
    -DE4_POS_T
    -DVERBATIM_GCODE_MODES
    -DWEBSOCKETS_TCP_TIMEOUT=750
lib_deps =
    https://github.com/MitchBradley/json-streaming-parser#charp-1.0.2
    https://github.com/MitchBradley/GrblParser#9108f54a3e30526b66194898676af34e96a87da9
build_src_filter = +<*.c> +<*.h> +<*.cpp> +<*.hpp>  -<System*.cpp> -<Hardware*.cpp> +<System.cpp> +<SystemScene.cpp> -<Touch_Class.cpp>

; Per-developer overrides (upload port, WiFi creds, OTA flags, etc.) live in
; platformio.local.ini (gitignored). The section below provides empty
; defaults so the build works without that file.
[pibot_local] 
build_flags =


[env:m5dial]
; Pendant based on M5Dial
; http://wiki.fluidnc.com/en/hardware/official/M5Dial_Pendant
platform = espressif32@6.9.0    ; pin official platform (not the pioarduino fork, which also installs as "espressif32")
board = m5stack-stamps3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
monitor_filters=esp32_exception_decoder
board_build.filesystem = littlefs
; upload_flags = --no-stub  ; WARNING: ROM-loader uploads can erase adjacent NVS
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified
    m5stack/M5Dial
build_flags =
    ${common.build_flags}
    -DUSE_M5
    -DUSE_WIFI
    -DUSE_ESPNOW  ; Enable ESP-NOW transport
custom_filesystem_start=0x670000
extra_scripts = ./build_merged.py
build_src_filter = ${common.build_src_filter} +<SystemArduino.cpp> +<HardwareM5Dial.cpp>

[jc_common]
build_flags =
    !python ./git-version.py
    -DBOARD_HAS_PSRAM

[env:jc8048w550]
; Isolated JC8048W550C_I hardware bring-up; intentionally excludes FluidDial
; scenes and CNC communications. Keep this target opt-in.
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.0
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
lib_deps =
    https://github.com/moononournation/Arduino_GFX.git#20d9ad25557e6d07668ad2192395a6058092af1c
    https://github.com/MitchBradley/GrblParser#9108f54a3e30526b66194898676af34e96a87da9
; Ordinary firmware = motion disabled (JC_MACHINE_CONTROL_ENABLED stays 0) plus the NON-MOTION jog
; test mode (Instruction 007): the experimental jog interface runs against a SIMULATED controller
; and no machine-changing command can be transmitted. JC_JOG_PREVIEW is rejected at compile time
; when combined with JC_LIVE_JOG_TEST or JC_MACHINE_CONTROL_ENABLED.
build_flags =
    ${jc_common.build_flags}
    -DJC_JOG_PREVIEW=1
build_src_filter = +<jc8048w550/*.cpp> +<version.cpp>

[env:jc8048w550_livejog_test]
; EXPERIMENTAL LIVE-JOG TEST BUILD (Instructions 006 / 006A). Never the default.
; Differs from env:jc8048w550 ONLY by the two flags below (and it does NOT carry -DJC_JOG_PREVIEW). In this image the gate
; authorizes a restricted incremental jog (X/Y 1 mm @ 100 mm/min only; Z is on hold
; and A is disabled) and the jog-cancel byte 0x85, and nothing else; continuous
; jog, homing, probing, macros, spindle and file execution stay blocked. It must
; not be flashed to a machine-connected device without the owner's explicit,
; separate approval and a written test procedure (docs/development).
extends = env:jc8048w550
build_flags =
    ${jc_common.build_flags}
    -DJC_MACHINE_CONTROL_ENABLED=1
    -DJC_LIVE_JOG_TEST=1

[env:cyd_base]
; Pendant based on a 2432S028 "Cheap Yellow Display" and a hand wheel pulse encoder
; http://wiki.fluidnc.com/en/hardware/official/CYD_Dial_Pendant
platform = espressif32@6.9.0    ; pin official platform (not the pioarduino fork, which also installs as "espressif32")
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@^3.20016.0
monitor_filters=esp32_exception_decoder
monitor_speed=115200
upload_speed=748800
board_build.filesystem = littlefs
; upload_flags = --no-stub  ; WARNING: ROM-loader uploads can erase adjacent NVS
lib_deps =
    ${common.lib_deps}
    ; m5stack/M5Unified
    LovyanGFX=https://github.com/lovyan03/LovyanGFX#develop
build_flags =
    ${common.build_flags}
    -DUSE_LOVYANGFX
    -DUSE_WIFI
    -DCYD_BATTERY_ADC
    ;-DCORE_DEBUG_LEVEL=5
    -DCYD_BUTTONS
custom_filesystem_start=0x290000
extra_scripts = ./build_merged.py
build_src_filter = ${common.build_src_filter} +<SystemArduino.cpp> +<Hardware2432.cpp> +<Touch_Class.cpp> -<cyd/*>

# This works for both resistive and capacitive CYDs, chosen at initial startup
[env:cyddial]
monitor_filters = esp32_exception_decoder
extends = env:cyd_base
build_flags =
    ${env:cyd_nodebug.build_flags}
    -DCYD_BUTTONS
    -DRESISTIVE_CYD
    -DCAPACITIVE_CYD
    -DUSE_ESPNOW  ; Enable ESP-NOW transport
    ; -DDEV_SKIP_TO_SCENE=multiJogScene     ; uncomment to test different scenes

# This is the original CYD build for a resistive CYD
[env:cyd_resistive]
extends = env:cyd_base
build_flags =
    ${env:cyd_base.build_flags}
    -DDEBUG_TO_USB
    -DRESISTIVE_CYD

# This is for a capacitive CYD without buttons or lockout
[env:cyd_nodebug]
extends = env:cyd_base
build_flags =
    ${env:cyd_base.build_flags}
    -DCAPACITIVE_CYD

# This is for a capacitive CYD with physical buttons
[env:cyd_buttons]
extends = env:cyd_nodebug
build_flags =
    ${env:cyd_nodebug.build_flags}
    -DCYD_BUTTONS

[env:windows]
; Runs the code under Windows, useful for development
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified@^0.1.10
platform = native
build_type = release
build_flags = -O0 -xc++ -std=c++17 -lSDL2
  ${common.build_flags}
  -DWINDOWS
  -DUSE_M5
  -DM5GFX_BOARD=board_M5Dial
  -I"C:/msys64/mingw32/include/SDL2"         ; for Windows SDL2
  -L"C:/msys64/mingw32/lib"                  ; for Windows SDL2
build_src_filter = ${common.build_src_filter} +<SystemWindows.cpp> -<Encoder.cpp>

[env:macos]
; Runs the code on macOS with SDL2 — preview GUI without flashing
; Requires SDL2: brew install sdl2
; Build:  pio run -e macos
; Run:    .pio/build/macos/program              (preview mode, no FluidNC)
; Run:    .pio/build/macos/program /dev/tty.xxx (connected to FluidNC via serial)
lib_deps =
    ${common.lib_deps}
    m5stack/M5Unified@^0.1.10
platform = native
build_type = release
build_flags = -O0 -xc++ -std=c++17 -lSDL2
  ${common.build_flags}
  -DMACOS
  -DUSE_M5
  -DUSE_WIFI
;   -DDEV_SKIP_TO_SCENE=statusScene         ; scene instance (lowercase), e.g. wifiSetupScene, aboutScene
  -DDEV_SIMULATED_CONNECT                  ; six-axis FluidNC fixture for scene previews
;   -DDEV_SKIP_TO_ESPNOW_PAIRING               ; jump straight to ESPNowPairingScene
  -DM5GFX_BOARD=board_M5Dial
  -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"  ; arm64 Mac (Apple Silicon)
  -L"${sysenv.HOMEBREW_PREFIX}/lib"
  -I"/usr/local/include/SDL2"                  ; x86_64 Mac (Intel)
  -L"/usr/local/lib"
build_src_filter = ${common.build_src_filter} +<SystemMacOS.cpp> -<Encoder.cpp>

[env:macos_cyd]
; Build:  pio run -e macos_cyd
; Run:    .pio/build/macos_cyd/program              (preview mode, no FluidNC)
; Run:    .pio/build/macos_cyd/program /dev/tty.xxx (connected to FluidNC via serial)
;
; Controls:  Q / W / E  = red / dial / green button
;            Scroll wheel inside sprite area = rotary encoder
;            Mouse = touch
lib_deps =
    ${common.lib_deps}
    LovyanGFX=https://github.com/lovyan03/LovyanGFX#develop
platform = native
build_type = release
build_flags = -O0 -xc++ -std=c++17 -lSDL2
  ${common.build_flags}
  -DMACOS
  -DUSE_LOVYANGFX
  -DUSE_WIFI
  -DCYD_BUTTONS
;   -DDEV_SKIP_TO_SCENE=firstBootScene         ; change to wifiSetupScene, aboutScene, etc.
;   -DDEV_SKIP_TO_ESPNOW_PAIRING               ; jump straight to ESPNowPairingScene
  -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"  ; arm64 Mac (Apple Silicon)
  -L"${sysenv.HOMEBREW_PREFIX}/lib"
  -I"/usr/local/include/SDL2"                  ; x86_64 Mac (Intel)
  -L"/usr/local/lib"
build_src_filter = ${common.build_src_filter} +<SystemMacOS_CYD.cpp> -<Encoder.cpp> +<Touch_Class.cpp>

[env:pibot]
; Per-developer build/upload settings (upload_port, upload_speed, etc.)
; live in platformio.local.ini.
extends = env:cyd_base
build_flags =
    ${env:cyd_base.build_flags}
    -DCAPACITIVE_CYD
    -DCYD_BUTTONS
    -DPIBOT_PENDANT
    -DFNC_BAUD=1000000
    ${pibot_local.build_flags}
